name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          python -m py_compile SystainerBinDesigner/*.py tests/*.py
          node --check SystainerBinDesigner/palette/layout.js
          node --check SystainerBinDesigner/palette/app.js
      - name: Unit and parity tests
        run: python -m unittest discover -s tests -v
